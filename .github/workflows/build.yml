name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
          unzip -q "$ZIP_FILE" -d src
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Build APK
        run: |
          cd src
          
          # settings.gradle thiyena main folder eka hoyagannawa
          PROJECT_DIR=$(find . -name settings.gradle* -exec dirname {} \; | head -1)
          
          if [ -z "$PROJECT_DIR" ]; then 
            echo "ERROR: settings.gradle not found inside zip!"; 
            exit 1; 
          fi
          
          cd "$PROJECT_DIR"
          
          # gradlew nathi nisa, system gradle eka use karamu
          gradle assembleDebug
          
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidOS-debug
          path: 'src/**/app/build/outputs/apk/debug/app-debug.apk'
