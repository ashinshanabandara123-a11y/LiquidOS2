name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q LiquidOS.zip -d src
          ls -la src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          cd src
          # zip eka athule root folder ekak thiboth path eka adjust karanna
          if [ -f gradlew ]; then PROJECT=. ; else PROJECT=$(find . -maxdepth 2 -name gradlew -exec dirname {} \; | head -1); fi
          cd "$PROJECT"
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidOS-debug
          path: src/**/app/build/outputs/apk/debug/app-debug.apk
